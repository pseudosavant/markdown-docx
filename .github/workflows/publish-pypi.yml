name: Publish to PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint, format, and type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Smoke-test editable skill lifecycle
        run: uv run python scripts/smoke_skill.py --expected-source local

      - name: Verify release tag matches package version
        if: github.event_name == 'release' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          version_output="$(uv run markdown-docx --version)"
          package_version="${version_output#markdown-docx }"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Package version $package_version does not match release tag $GITHUB_REF_NAME."
            exit 1
          }

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uv run twine check dist/*

      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/markdown-docx --version
          .wheel-smoke/bin/markdown-docx --inspect-template --json
          .wheel-smoke/bin/python scripts/smoke_skill.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/markdown-docx
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
